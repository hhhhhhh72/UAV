version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: drone
      POSTGRES_PASSWORD: drone_secret
      POSTGRES_DB: drone_platform
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drone -d drone_platform"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      # 密钥一律从 compose 同目录 .env 读取，禁止硬编码进 git
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET must be set in .env}"
      # DB 连接串固定为 compose 网络内地址（.env 中的 DATABASE_URL 是宿主机视角，不能用于容器）
      DATABASE_URL: "postgres://drone:drone_secret@db:5432/drone_platform?sslmode=disable"
      # ENCRYPTION_KEY = openssl rand -base64 32（32 字节）
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set in .env}"
      # 生产不再支持 ADMIN_DEV_MODE 开发令牌（后台登录走 /api/auth/login 账号密码）
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173}"
      # 微信登录（值来自服务器 .env，密钥不进 git）
      WECHAT_APPID: "${WECHAT_APPID:-}"
      WECHAT_APPSECRET: "${WECHAT_APPSECRET:-}"
      # banner 图片 URL 补全域名用（如 https://api.cqnarc.cn）；缺省时回退 nginx X-Forwarded-Proto
      BASE_URL: "${BASE_URL:-}"
    volumes:
      - uploads:/uploads
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pgdata:
  uploads:
