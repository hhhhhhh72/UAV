version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: drone
      POSTGRES_PASSWORD: drone_secret
      POSTGRES_DB: drone_platform
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drone -d drone_platform"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      AUTH_SECRET: "replace-with-a-long-random-production-secret"
      DATABASE_URL: "postgres://drone:drone_secret@db:5432/drone_platform?sslmode=disable"
      ENCRYPTION_KEY: "replace-with-a-32-byte-base64-encoded-key"
      CORS_ORIGINS: "http://localhost:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pgdata:
  uploads:
