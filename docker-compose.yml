version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: drone
      POSTGRES_PASSWORD: drone_secret
      POSTGRES_DB: drone_platform
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drone -d drone_platform"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      # ⚠️ 测试阶段密钥（已生成随机值）。正式上线前必须重新生成！
      AUTH_SECRET: "04f91cce9c44c5713714f03b243126b3a46d1f5b029750b6771bfd43b1b0c8fc"
      DATABASE_URL: "postgres://drone:drone_secret@db:5432/drone_platform?sslmode=disable"
      # ENCRYPTION_KEY = openssl rand -base64 32（32 字节）
      ENCRYPTION_KEY: "SQCLSvrOym3VsMSjXygymbE6DJZyME4WEWPou5umLxQ="
      CORS_ORIGINS: "http://localhost:5173"
      # 微信登录（值来自服务器 .env，密钥不进 git）
      WECHAT_APPID: "${WECHAT_APPID:-}"
      WECHAT_APPSECRET: "${WECHAT_APPSECRET:-}"
      # 测试阶段开启开发令牌（后台一键登录）；正式上线删除此行
      ADMIN_DEV_MODE: "true"
    volumes:
      - uploads:/uploads
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pgdata:
  uploads:
