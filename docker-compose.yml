version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # 固定容器名：deploy/db-backup.sh 的 docker exec 目标（原按项目目录推导，改名即静默失败）
    container_name: uav-db-1
    environment:
      POSTGRES_USER: drone
      # 密码从 .env 读取（安全审计：撤掉 :-drone_secret 弱默认回退，强制必填防生产误用弱口令）
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
      POSTGRES_DB: drone_platform
      # 与 api 一致使用东八区：备份脚本时间戳、日志时间与服务器本地时间对齐
      TZ: Asia/Shanghai
    ports:
      # 仅绑定回环：本机 run_api.bat 需要 5433，但不对局域网/公网暴露 DB
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drone -d drone_platform"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    # docker logs 轮转上限：单文件 20M × 5 份，防止 db 日志无限增长占满磁盘
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  api:
    build: .
    restart: unless-stopped
    ports:
      # 仅绑定回环：公网流量一律经宿主机 nginx 反代（nginx 负责设置 X-Forwarded-For）。
      # 直连 8080 被防火墙/绑定阻断，XFF 头不可伪造，限流按真实客户端 IP 生效。
      - "127.0.0.1:8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      ENV: "${ENV:-production}"
      # 密钥一律从 compose 同目录 .env 读取，禁止硬编码进 git
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET must be set in .env}"
      # DB 连接串固定为 compose 网络内地址（.env 中的 DATABASE_URL 是宿主机视角，不能用于容器）
      DATABASE_URL: "postgres://drone:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/drone_platform?sslmode=disable"
      # ENCRYPTION_KEY = openssl rand -base64 32（32 字节）
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set in .env}"
      # 合同 webhook 签名密钥（生产 config 硬校验必填）
      SIGNING_SECRET: "${SIGNING_SECRET:?SIGNING_SECRET must be set in .env}"
      # 生产不再支持 ADMIN_DEV_MODE 开发令牌（后台登录走 /api/auth/login 账号密码）
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173}"
      # 微信登录（值来自服务器 .env，密钥不进 git；生产 config 硬校验必填）
      WECHAT_APPID: "${WECHAT_APPID:-}"
      WECHAT_APPSECRET: "${WECHAT_APPSECRET:-}"
      # banner 图片 URL 补全域名用（如 https://api.cqnarc.cn）；缺省时回退 nginx X-Forwarded-Proto
      BASE_URL: "${BASE_URL:-}"
    volumes:
      - uploads:/uploads
      - logs:/logs
    # 安全加固（审计 H1）：只读根文件系统 + 裁剪全部能力 + 禁止提权——RCE 后容器隔离层最小暴露
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    # docker logs 轮转上限：应用日志同时落文件（/logs 卷，50MB×5 轮转），
    # json-file 再兜一层 20M×5，杜绝 docker logs 无限增长。
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          # 图片缩放单请求峰值 >130MB，256M 有 OOM 风险 → 512m 保守充足
          memory: 512M
          # 限制单容器 CPU 上限，防止图片处理打满宿主机
          cpus: "2.0"

volumes:
  pgdata:
  uploads:
  logs:
