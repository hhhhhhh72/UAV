# ══════════════════════════════════════════════════════════
# 组件模型
# ══════════════════════════════════════════════════════════
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: HMAC-SHA256 Bearer Token，15分钟过期

  schemas:
    HealthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            status:
              type: string
            checks:
              type: object
              properties:
                server:
                  type: string
                storage:
                  type: string
        request_id:
          type: string

    AuthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            access_token:
              type: string
              description: 访问令牌（15分钟有效）
            refresh_token:
              type: string
              description: 刷新令牌（7天有效）
            user:
              type: object
              properties:
                id:
                  type: string
                role:
                  type: string
        request_id:
          type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: 错误码（VALIDATION_ERROR/UNAUTHENTICATED/FORBIDDEN/NOT_FOUND/CONFLICT/STATE_INVALID/RATE_LIMITED/INTERNAL）
            message:
              type: string
        request_id:
          type: string

    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        request_id:
          type: string

    Enterprise:
      type: object
      properties:
        id:
          type: string
        owner_user_id:
          type: string
        name:
          type: string
        license_url:
          type: string
        account_name:
          type: string
        status:
          type: string
          enum: [draft, submitted, supplement_required, approved, rejected]
        is_member:
          type: boolean
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Demand:
      type: object
      properties:
        id:
          type: string
        publisher_id:
          type: string
        publisher_name:
          type: string
        contact:
          type: string
          description: 公开接口返回时脱敏
        biz_type:
          type: string
          enum: [cable_inspection, plant_transport, spray_pesticide, clean_paint, trade_lease, other]
        title:
          type: string
        description:
          type: string
        images:
          type: array
          items:
            type: string
        budget_fen:
          type: integer
        status:
          type: string
          enum: [pending, published, matched, completed, cancelled, rejected]
        district:
          type: string

    DemandBid:
      type: object
      properties:
        id:
          type: string
        demand_id:
          type: string
        bidder_id:
          type: string
        bidder_name:
          type: string
        amount_fen:
          type: integer
        proposal:
          type: string
        status:
          type: string
          enum: [pending, accepted, rejected]

    Contract:
      type: object
      properties:
        id:
          type: string
        enterprise_id:
          type: string
        template_id:
          type: string
        status:
          type: string
          enum: [draft, sent, signing, signed, voided, expired]
        sign_url:
          type: string
