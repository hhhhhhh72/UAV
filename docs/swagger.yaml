basePath: /
host: localhost:8080
info:
  contact:
    name: 重庆市无人机产业协会
  description: |-
    面向微信小程序与 Web 管理后台的全栈服务平台，覆盖无人机产业链 7 大业务系统。
    ## 认证
    Bearer Token (HMAC-SHA256)，15 分钟过期。
    在请求头中添加 `Authorization: Bearer <token>`。
    ## 分页
    分页接口统一使用 `?page=1&page_size=20`，返回 `{ data, total, page, page_size }`。
    ## 角色
    - `platform_admin` 平台管理员
    - `association_admin` 协会管理员
    - `enterprise` 企业用户
    - `individual` 个人用户
  title: 无人机产业综合服务平台 API
  version: "1.0"
paths:
  /:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: API 首页信息
      tags:
      - 系统
  /api/auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: 刷新令牌
