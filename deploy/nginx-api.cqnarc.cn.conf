# 生产 nginx 站点配置的**只读镜像**（2026-09-21 从服务器 /etc/nginx/sites-available/api.cqnarc.cn 取回）。
#
# 为什么把它放进仓库：这份配置此前**只存在于服务器上**，而它决定了 TLS 证书读哪个文件、
# 上传体积上限、限流阈值、反向代理指向 —— 机器一丢就没人知道原来是怎么配的。
# 注意：仓库里的这份**不会自动部署**，它只是备份与对照；改服务器后要同步回来。
# 部署位置：/etc/nginx/sites-available/api.cqnarc.cn（软链到 sites-enabled/）。
#
# 两处与证书自动化有关，别删：
#   · 80 端口那段保留了 ACME webroot 目录 —— 域名备案后 HTTP-01 也能用（现在用不了，
#     因为腾讯云会劫持境外来源的 80 端口，见 deploy/cert-renew.sh 顶部说明）。
#   · 443 读的是 /etc/nginx/certs/api.cqnarc.cn.{fullchain.crt,key}，
#     deploy/cert-renew.sh 用 acme.sh 的 --fullchain-file/--key-file 直接写这两个路径，
#     所以续期脚本不需要改 nginx 配置。
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.cqnarc.cn;
    location /.well-known/acme-challenge/ {
        root /var/www/acme-webroot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.cqnarc.cn;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    ssl_certificate     /etc/nginx/certs/api.cqnarc.cn.fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/api.cqnarc.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 50m;

    root /var/www/admin;
    index index.html;

    location /api/ {
        limit_req zone=api_limit burst=80 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        add_header Cache-Control "public, immutable";
        proxy_pass http://127.0.0.1:8080;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 运维状态快照（探活用）：主机侧 deploy/ops-status.sh 每 10 分钟生成。
    # 刻意用 alias 指向 SPA 目录之外——SPA 部署会 rm -rf /var/www/admin/*，
    # 放在里面会被清掉，探活读到 404 而误报。
    location = /ops-status.json {
        alias /var/www/ops-status.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }
}
