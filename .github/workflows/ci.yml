name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: drone
          POSTGRES_PASSWORD: drone_secret
          POSTGRES_DB: drone_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test with coverage
        env:
          DATABASE_URL: postgres://drone:drone_secret@localhost:5432/drone_platform?sslmode=disable
        # 失败时把「哪个用例挂了」写成 check annotation：Actions 的原始日志需要仓库
        # 管理员权限才能下载，而 annotation 可以匿名读取——CI 红了一个月却无人能
        # 从外部看到原因，就是卡在这里。
        run: |
          set +e
          go test ./internal/... -count=1 -coverprofile=coverage.out 2>&1 | tee /tmp/gotest.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo '===== 失败用例 ====='
            grep -E '^--- FAIL|^    --- FAIL' /tmp/gotest.log || true
            echo '===== 失败详情 ====='
            grep -B 1 -A 20 '^--- FAIL' /tmp/gotest.log | head -120 || true
            echo '===== 编译/panic ====='
            grep -E 'cannot use|undefined:|too many arguments|not enough arguments|panic:' /tmp/gotest.log | head -20 || true
            # 转义后塞进 annotation（% 要转义，换行用 ~ 以保持可读）
            msg=$(grep -E '^--- FAIL|^    --- FAIL|^ +[a-z_]+_test\.go:[0-9]+:' /tmp/gotest.log | head -40 | tr '\n' '~' | tr -d '%')
            echo "::error title=GoTestFailure::${msg:0:1800}"
          fi
          exit $rc

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage.out
          path: coverage.out

      - name: Race detection
        # 同 Test with coverage：失败时把竞态点写进 annotation（日志需管理员权限，注解可匿名读）
        run: |
          set +e
          go test -race ./internal/... -count=1 2>&1 | tee /tmp/race.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo '===== 失败用例 / 竞态点 ====='
            grep -E '^--- FAIL|WARNING: DATA RACE' /tmp/race.log | head -20 || true
            echo '===== 竞态详情 ====='
            grep -A 25 'WARNING: DATA RACE' /tmp/race.log | head -80 || true
            grep -A 12 '^--- FAIL' /tmp/race.log | head -60 || true
            msg=$(grep -E '^--- FAIL|WARNING: DATA RACE|^ +[a-z_/]+\.go:[0-9]+' /tmp/race.log | head -35 | tr '\n' '~' | tr -d '%')
            echo "::error title=RaceFailure::${msg:0:1800}"
          fi
          exit $rc

      - name: Vulnerability scan (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (npm audit)
        run: npm audit --audit-level=moderate || true

      - name: Build production bundle
        run: npm run build

      - name: Miniprogram route check
        # 小程序没有构建期路由校验：删了页面忘改 pages.json、或某份白名单里留着已删页面的
        # 路径，都要等用户点进去才发现是白屏。2026-09-20 就靠它查出首页横幅白名单
        # ALLOWED_ROUTES 里还留着已删除的 shops/index（shops 表早随迁移 000113 删掉），
        # 以及三个早已并入统一发布表单的旧发布页仍挂在 pages.json 注册表里。
        # 脚本在仓库根的 scripts/（不是 .tools/ —— 那个目录被 gitignore，CI 拿不到）。
        working-directory: .
        run: node scripts/check-miniprogram-routes.cjs
