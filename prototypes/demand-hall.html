<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>需求大厅 — 低空综合服务平台小程序原型</title>
<style>
  :root {
    --brand-deep:#074D92; --brand:#0A66C2; --brand-soft:#EAF3FB; --brand-subtle:#F4F8FC;
    --accent:#F97316; --accent-deep:#E96012; --accent-soft:#FFF0E6;
    --t1:#17212B; --t2:#344054; --t3:#667085; --t4:#98A2B3;
    --canvas:#F4F6F8; --surface:#FFF; --border:#E4E7EC; --divider:#EEF1F4;
    --success:#168A55; --success-soft:#E9F7F0;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC',sans-serif; background:#dfe3e8; display:flex; justify-content:center; min-height:100vh; padding:24px 12px; }
  .phone { width:390px; height:844px; background:var(--canvas); border-radius:32px; overflow:hidden; position:relative; box-shadow:0 12px 48px rgba(16,24,40,.18); }
  @media (max-width:430px) { body{padding:0} .phone{width:100vw;height:100vh;border-radius:0} }
  .status-bar { height:44px; background:var(--brand-deep); color:#fff; display:flex; align-items:flex-end; justify-content:space-between; padding:0 20px 6px; font-size:11px; }
  .capsule { width:80px; height:26px; border:1px solid rgba(255,255,255,.35); border-radius:14px; display:flex; align-items:center; justify-content:space-between; padding:0 8px; font-size:10px; color:rgba(255,255,255,.85); }
  .nav { background:var(--brand-deep); padding:8px 12px 12px; display:flex; align-items:center; gap:8px; }
  .nav-city { color:#fff; font-size:13px; display:flex; align-items:center; gap:3px; white-space:nowrap; }
  .search { flex:1; height:40px; background:var(--surface); border-radius:6px; display:flex; align-items:center; gap:6px; padding:0 12px; color:var(--t4); font-size:12px; }
  .search svg { flex-shrink:0; }
  /* 分类轨道 */
  .cats { background:var(--surface); padding:10px 12px; display:flex; gap:8px; overflow-x:auto; border-bottom:1px solid var(--divider); }
  .cat { flex-shrink:0; height:30px; padding:0 14px; border-radius:6px; border:1px solid var(--border); display:flex; align-items:center; font-size:12px; color:var(--t2); background:var(--surface); cursor:pointer; }
  .cat.on { background:var(--brand); border-color:var(--brand); color:#fff; font-weight:600; }
  /* 需求列表 */
  .list { padding:12px; overflow-y:auto; height:calc(100% - 44px - 58px - 51px - 64px); display:flex; flex-direction:column; gap:10px; }
  .demand { background:var(--surface); border-radius:8px; overflow:hidden; box-shadow:0 3px 12px rgba(16,24,40,.05); cursor:pointer; }
  .d-img { aspect-ratio:16/7; display:flex; align-items:center; justify-content:center; background:var(--brand-subtle); color:var(--brand); }
  .d-body { padding:10px 12px 12px; }
  .d-meta { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
  .d-type { font-size:10px; padding:2px 6px; border-radius:4px; background:var(--brand-soft); color:var(--brand); }
  .d-status { font-size:10px; padding:2px 6px; border-radius:4px; background:var(--success-soft); color:var(--success); }
  .d-status.closed { background:var(--divider); color:var(--t3); }
  .d-title { font-size:14px; font-weight:700; color:var(--t1); line-height:1.45; margin-bottom:6px; }
  .d-sub { font-size:11px; color:var(--t3); display:flex; gap:10px; margin-bottom:10px; }
  .d-foot { display:flex; align-items:center; justify-content:space-between; }
  .d-budget { font-size:14px; font-weight:760; color:var(--accent-deep); }
  .d-budget small { font-size:10px; font-weight:400; color:var(--t3); }
  .d-contact { height:30px; padding:0 14px; border-radius:6px; background:var(--brand); color:#fff; font-size:11px; display:flex; align-items:center; cursor:pointer; }
  /* 骨架 */
  .skeleton .d-img { background:var(--divider); }
  .skeleton .line { height:12px; background:var(--divider); border-radius:4px; margin-top:8px; }
  /* 状态 */
  .state { height:calc(100% - 44px - 58px - 51px - 64px); display:none; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:var(--t3); font-size:12px; }
  .state .s-ico { width:64px; height:64px; border-radius:50%; background:var(--brand-soft); display:flex; align-items:center; justify-content:center; }
  .state .s-btn { height:36px; padding:0 20px; border-radius:6px; background:var(--brand); color:#fff; font-size:12px; display:flex; align-items:center; cursor:pointer; }
  .state .s-note { font-size:11px; color:var(--t4); }
  /* 详情弹层 */
  .sheet-mask { position:absolute; inset:0; background:rgba(16,24,40,.4); opacity:0; pointer-events:none; transition:opacity .2s; z-index:20; }
  .sheet-mask.show { opacity:1; pointer-events:auto; }
  .sheet { position:absolute; left:0; right:0; bottom:0; background:var(--surface); border-radius:8px 8px 0 0; transform:translateY(100%); transition:transform .26s cubic-bezier(.2,.8,.2,1); z-index:30; max-height:78%; overflow-y:auto; }
  .sheet.open { transform:translateY(0); }
  .sheet-bar { height:4px; width:36px; background:var(--divider); border-radius:2px; margin:8px auto 0; }
  .sheet-head { display:flex; align-items:center; justify-content:space-between; padding:10px 16px 6px; }
  .sheet-title { font-size:15px; font-weight:700; color:var(--t1); }
  .sheet-close { width:32px; height:32px; display:flex; align-items:center; justify-content:center; color:var(--t3); cursor:pointer; }
  .sheet-info { padding:6px 16px 16px; }
  .s-row { display:flex; justify-content:space-between; font-size:12px; color:var(--t2); padding:10px 0; border-bottom:1px solid var(--divider); }
  .s-row b { color:var(--t1); font-weight:600; }
  .s-desc { font-size:12px; color:var(--t2); line-height:1.7; padding:10px 0; }
  .sheet-cta { position:sticky; bottom:0; background:var(--surface); padding:12px 16px calc(12px + env(safe-area-inset-bottom)); display:flex; gap:10px; }
  .btn { flex:1; height:42px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; cursor:pointer; }
  .btn.ghost { border:1px solid var(--border); color:var(--t2); }
  .btn.primary { background:var(--brand); color:#fff; }
  /* 底部导航 */
  .tabbar { position:absolute; left:0; right:0; bottom:0; height:64px; background:var(--surface); border-top:1px solid var(--divider); display:flex; z-index:10; }
  .tab { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:10px; color:var(--t4); cursor:pointer; }
  .tab.on { color:var(--brand); font-weight:600; }
  .tab .ico { width:22px; height:22px; }
  .tab.publish .ico { color:var(--accent); }
  /* 控制器 */
  .controls { position:fixed; left:24px; top:24px; width:220px; background:#fff; border-radius:10px; box-shadow:0 8px 32px rgba(16,24,40,.12); padding:14px; z-index:100; }
  .controls h3 { font-size:12px; color:var(--t2); margin-bottom:10px; }
  .controls .c-btn { display:block; width:100%; text-align:left; padding:8px 10px; border:none; background:var(--canvas); border-radius:6px; font-size:12px; color:var(--t2); cursor:pointer; margin-bottom:6px; }
  .controls .c-btn:hover { background:var(--brand-soft); }
  .controls .c-note { font-size:10px; color:var(--t4); margin-top:8px; line-height:1.5; }
  @media (max-width:430px) { .controls { display:none; } }
  svg { display:block; }
</style>
</head>
<body>

<div class="phone" id="phone">
  <div class="status-bar"><span>9:41</span><div class="capsule"><span>●</span><span>▮</span></div></div>

  <div class="nav">
    <span class="nav-city">重庆 ▾</span>
    <div class="search" onclick="toast('搜索需求关键词或区域')">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#98A2B3" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="9" r="6"/><path d="M13.5 13.5L18 18"/></svg>
      <span>搜索吊运 / 巡检 / 区域</span>
    </div>
  </div>

  <div class="cats" id="cats">
    <div class="cat on" onclick="selectCat(this,'all')">全部</div>
    <div class="cat" onclick="selectCat(this,'lift')">吊运</div>
    <div class="cat" onclick="selectCat(this,'aerial')">航拍</div>
    <div class="cat" onclick="selectCat(this,'plant')">植保</div>
    <div class="cat" onclick="selectCat(this,'patrol')">巡检</div>
    <div class="cat" onclick="selectCat(this,'survey')">测绘</div>
    <div class="cat" onclick="selectCat(this,'logistics')">物流</div>
    <div class="cat" onclick="selectCat(this,'purchase')">采购</div>
  </div>

  <div class="list" id="list"></div>

  <div class="state" id="stateEmpty">
    <div class="s-ico"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0A66C2" stroke-width="1.8" stroke-linecap="round"><path d="M4 8h16v10H4z"/><path d="M8 8V6h8v2"/><path d="M9 13h6"/></svg></div>
    <div>该分类暂无需求</div>
    <div class="s-note">切换分类，或发布需求等待响应</div>
  </div>

  <div class="state" id="stateError">
    <div class="s-ico"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#D92D20" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg></div>
    <div>需求列表加载失败</div>
    <div class="s-btn" onclick="retryLoad()">重新加载</div>
  </div>

  <div class="sheet-mask" id="mask" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-bar"></div>
    <div class="sheet-head">
      <span class="sheet-title" id="sTitle">需求详情</span>
      <span class="sheet-close" onclick="closeSheet()"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#667085" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg></span>
    </div>
    <div class="sheet-info">
      <div class="s-row"><span>类型 / 状态</span><b id="sMeta">—</b></div>
      <div class="s-row"><span>区域</span><b id="sLoc">—</b></div>
      <div class="s-row"><span>预算</span><b id="sBudget">—</b></div>
      <div class="s-row"><span>发布时间</span><b id="sTime">—</b></div>
      <div class="s-desc" id="sDesc">—</div>
    </div>
    <div class="sheet-cta">
      <div class="btn ghost" onclick="toast('已复制联系方式')">复制联系方式</div>
      <div class="btn primary" onclick="toast('正在拨打')">拨打电话</div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab" onclick="toast('首页')"><span class="ico"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L11 3l8 7.5"/><path d="M5 9.5V19h12V9.5"/></svg></span>首页</div>
    <div class="tab" onclick="toast('商城')"><span class="ico"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h14v10H4z"/><path d="M8 7V5h6v2"/></svg></span>商城</div>
    <div class="tab publish" onclick="toast('发布')"><span class="ico"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M11 4v14M4 11h14"/></svg></span>发布</div>
    <div class="tab" onclick="toast('商家')"><span class="ico"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l2-5h12l2 5"/><path d="M3 9v10h16V9"/><circle cx="11" cy="13" r="2.5"/></svg></span>商家</div>
    <div class="tab" onclick="toast('我的')"><span class="ico"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="7" r="3.5"/><path d="M4.5 19c1.2-3.5 3.8-5 6.5-5s5.3 1.5 6.5 5"/></svg></span>我的</div>
  </div>
</div>

<div class="controls">
  <h3>设计评审 · 需求大厅</h3>
  <button class="c-btn" onclick="setState('normal')">正常态</button>
  <button class="c-btn" onclick="setState('loading')">加载态（骨架）</button>
  <button class="c-btn" onclick="setState('empty')">空数据态</button>
  <button class="c-btn" onclick="setState('error')">失败态</button>
  <div class="c-note">分类可切换；点击需求卡打开详情（含联系方式/拨打电话）；375/390 自适应。</div>
</div>

<script>
const DATA = {
  all: [
    { t:'吊运', key:'lift', title:'沙坪坝工地吊运 300 吨钢管至 12 层', loc:'重庆·沙坪坝', budget:'¥45,000', time:'今天 09:20', status:'open', desc:'工地 12 层平台吊运，需 8 吨级无人机，工期 3 天，可到现场勘查。' },
    { t:'巡检', key:'patrol', title:'光伏电站月度巡检 50MW 阵列', loc:'重庆·江津', budget:'¥18,000', time:'今天 08:45', status:'open', desc:'50MW 光伏阵列月度巡检，含热成像，输出缺陷报告，需 2 日内完成。' },
    { t:'植保', key:'plant', title:'柑橘园植保飞防 1200 亩', loc:'重庆·奉节', budget:'¥12 /亩', time:'昨天 17:30', status:'open', desc:'1200 亩柑橘园统一飞防，用药由业主提供，需 3 台以上植保机。' },
    { t:'航拍', key:'aerial', title:'产业园宣传航拍（4K 成片）', loc:'重庆·两江新区', budget:'¥6,000', time:'昨天 15:10', status:'open', desc:'产业园航拍宣传片，含后期剪辑，2 分钟成片，周五前交付。' },
    { t:'吊运', key:'lift', title:'河道清淤设备吊装（已结束）', loc:'重庆·万州', budget:'¥28,000', time:'3 天前', status:'closed', desc:'河道清淤设备吊装运输，已由本地飞手承接完成。' },
    { t:'测绘', key:'survey', title:'桥梁病害检测激光扫描', loc:'重庆·涪陵', budget:'¥32,000', time:'4 天前', status:'open', desc:'跨江大桥桥墩病害激光扫描，输出三维点云与病害标注。' },
  ],
  lift:[0,4], aerial:[3], plant:[2], patrol:[1], survey:[5], logistics:[], purchase:[]
};

function iconFor(k){
  const map={lift:'M12 3l8 18H4L12 3z',aerial:'M12 4l6 14H6L12 4z',plant:'M12 3v14m0 0h-3m3 0h3M12 7c-4 0-6 2-6 5h12c0-3-2-5-6-5z',patrol:'M12 3l8 18H4L12 3z',survey:'M4 20V8l8-5 8 5v12',logistics:'M4 16V6h12v10M4 16h12m-9 4h6',purchase:'M4 8h16v10H4z'};
  return '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="'+(map[k]||map.lift)+'"/></svg>';
}

function render(items){
  const list=document.getElementById('list');
  list.innerHTML=items.map(d=>`
    <div class="demand" onclick="openDetail('${d.title}')">
      <div class="d-img">${iconFor(d.key)}</div>
      <div class="d-body">
        <div class="d-meta"><span class="d-type">${d.t}</span><span class="d-status ${d.status==='closed'?'closed':''}">${d.status==='open'?'进行中':'已结束'}</span></div>
        <div class="d-title">${d.title}</div>
        <div class="d-sub"><span>${d.loc}</span><span>${d.time}</span></div>
        <div class="d-foot">
          <span class="d-budget">${d.budget}</span>
          <span class="d-contact" onclick="event.stopPropagation();openDetail('${d.title}')">电话联系</span>
        </div>
      </div>
    </div>`).join('');
}

function selectCat(el,key){
  document.querySelectorAll('.cat').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  const items=(DATA[key]||[]).map(i=>DATA.all[i]);
  document.getElementById('list').style.display='flex';
  ['stateEmpty','stateError'].forEach(id=>document.getElementById(id).style.display='none');
  if(items.length===0){ document.getElementById('list').style.display='none'; document.getElementById('stateEmpty').style.display='flex'; return; }
  render(items);
}

function retryLoad(){
  const on=document.querySelector('#cats .cat.on');
  if(on) on.click();
}

function setState(s){
  const on=document.querySelector('#cats .cat.on');
  const key=on?on.textContent.trim():'全部';
  document.getElementById('stateEmpty').style.display='none';
  document.getElementById('stateError').style.display='none';
  if(s==='loading'){
    document.getElementById('list').style.display='flex';
    document.getElementById('list').innerHTML='<div class="demand skeleton"><div class="d-img"></div><div class="d-body"><div class="line"></div><div class="line" style="width:70%"></div></div></div>'.repeat(5);
  } else if(s==='empty'){
    document.getElementById('list').style.display='none'; document.getElementById('stateEmpty').style.display='flex';
  } else if(s==='error'){
    document.getElementById('list').style.display='none'; document.getElementById('stateError').style.display='flex';
  } else {
    const all=document.querySelectorAll('.cat'); let target='all';
    all.forEach(c=>{ if(c.classList.contains('on')) target=c.textContent.trim(); });
    const items=(DATA[target]||[]).map(i=>DATA.all[i]);
    document.getElementById('list').style.display='flex';
    items.length?render(items):(document.getElementById('list').style.display='none',document.getElementById('stateEmpty').style.display='flex');
  }
}

function openDetail(title){
  const d=DATA.all.find(x=>x.title===title); if(!d) return;
  document.getElementById('sTitle').textContent=d.title;
  document.getElementById('sMeta').textContent=d.t+' · '+(d.status==='open'?'进行中':'已结束');
  document.getElementById('sLoc').textContent=d.loc;
  document.getElementById('sBudget').textContent=d.budget;
  document.getElementById('sTime').textContent=d.time;
  document.getElementById('sDesc').textContent=d.desc;
  document.getElementById('sheet').classList.add('open');
  document.getElementById('mask').classList.add('show');
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('mask').classList.remove('show');
}
function toast(msg){
  const t=document.createElement('div');
  t.style.cssText='position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(23,33,43,.85);color:#fff;font-size:12px;padding:8px 16px;border-radius:6px;z-index:99;transition:opacity .2s';
  t.textContent=msg;
  document.getElementById('phone').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),200)},1600);
}
document.getElementById('sheet').addEventListener('click',e=>e.stopPropagation());
render(DATA.all);
</script>
</body>
</html>
