<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 穿越门/拱门 -->
  <path d="M25 70 L25 35 Q25 25 35 25 L65 25 Q75 25 75 35 L75 70" stroke="#424245" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <rect x="22" y="68" width="56" height="6" rx="2" fill="#424245" opacity="0.9"/>
  
  <!-- 无人机 -->
  <g transform="translate(50, 45)">
    <!-- 机身 -->
    <rect x="-8" y="-4" width="16" height="8" rx="3" fill="#424245" opacity="0.95"/>
    
    <!-- 螺旋桨臂 -->
    <line x1="-6" y1="-2" x2="-14" y2="-10" stroke="#424245" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <line x1="6" y1="-2" x2="14" y2="-10" stroke="#424245" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <line x1="-6" y1="2" x2="-14" y2="10" stroke="#424245" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <line x1="6" y1="2" x2="14" y2="10" stroke="#424245" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    
    <!-- 螺旋桨 -->
    <ellipse cx="-14" cy="-10" rx="5" ry="2" fill="#424245" opacity="0.7"/>
    <ellipse cx="14" cy="-10" rx="5" ry="2" fill="#424245" opacity="0.7"/>
    <ellipse cx="-14" cy="10" rx="5" ry="2" fill="#424245" opacity="0.7"/>
    <ellipse cx="14" cy="10" rx="5" ry="2" fill="#424245" opacity="0.7"/>
  </g>
  
  <!-- 飞行轨迹线 -->
  <path d="M15 45 Q25 40 35 45" stroke="#424245" stroke-width="2" stroke-linecap="round" opacity="0.5" fill="none"/>
  <path d="M65 45 Q75 40 85 45" stroke="#424245" stroke-width="2" stroke-linecap="round" opacity="0.5" fill="none"/>
</svg>
