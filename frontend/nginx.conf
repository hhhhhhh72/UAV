# 生产 nginx 配置模板（修复版 2026-08）
# 修正历史三处错配：upstream 端口 8090→8080（docker-compose api 暴露 8080）、
# server_name 统一 api.cqnarc.cn、静态路径以 vite base='/' 为准（/low-altitude/ 为兼容遗留）。
# 部署前按实际证书路径与域名替换占位。

proxy_cache_path /var/cache/nginx/img levels=1:2 keys_zone=img_cache:10m max_size=500m inactive=30d use_temp_path=off;

# 限流 zone（应用层已有 100/s 令牌桶，nginx 层加公网兜底）
# 注意：rate/burst 必须能容忍单页并发（"我的"页并发 15+ 请求），
# 否则正常用户整页请求会批量 503（burst=5 的教训：20r/m+5 曾致生产 503）
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=600r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=120r/m;

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name api.cqnarc.cn localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.cqnarc.cn localhost;

    ssl_certificate /etc/nginx/cert/api.cqnarc.cn.pem;
    ssl_certificate_key /etc/nginx/cert/api.cqnarc.cn.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/x-javascript application/xml image/svg+xml;
    gzip_vary on;

    # 安全响应头（server 级；位置级因 nginx add_header 不继承规则，
    # 下述各 location 内需显式重复 ——否则 /uploads 与 /api/v1/image 丢失 nosniff/HSTS）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 静态资源（带 hash 的 JS/CSS）长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 图片压缩 API 代理 - 启用 Nginx 缓存层
    location /api/v1/image {
        proxy_pass http://172.17.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept $http_accept;

        proxy_cache img_cache;
        proxy_cache_key "$request_uri$http_accept";
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
    }

    # 后端 API（公网兜底限流：10r/s/IP + burst 80，兼容整页并发）
    location /api/ {
        limit_req zone=api_limit burst=80 nodelay;
        proxy_pass http://172.17.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
    }

    # 登录/短信/上传：更严格限流（防爆破，应用层 5 次/10min 之上再加 nginx 兜底）
    location ~ ^/api/(auth/|v1/files/) {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://172.17.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
    }

    # 上传文件（长缓存；/uploads/private/ 由后端鉴权）
    location /uploads/ {
        proxy_pass http://172.17.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        # 非图片类（PDF 等）强制下载，防内联脚本化；图片类仍内联展示
        add_header Content-Disposition "attachment" always;
    }

    # 兼容遗留 /low-altitude/ 前缀（旧部署路径；新构建为 '/'）
    location /low-altitude/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }
}
