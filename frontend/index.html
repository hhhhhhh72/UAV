<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚁</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>无人机产业综合服务平台</title>
    <meta name="description" content="重庆无人机产业协会 — 产业综合服务平台">
    <script>
      // Global Error Handler for White Screen Debugging
      //
      // 安全（P0）：错误内容一律用 textContent 写入 DOM，绝不做字符串拼 HTML。
      // msg/url/event.reason 都可能携带后端返回的文案（utils/http.js 会把
      // resp.data.error.message 提升到 error.message），历史上这里是
      // insertAdjacentHTML 拼接 —— 一个可被后端 4xx 文案触发的 DOM XSS 汇聚点。
      function showErrorBar(title, lines, bg) {
        try {
          var box = document.createElement('div');
          box.style.cssText = 'position:fixed;top:0;left:0;right:0;background:' + bg +
            ';color:white;padding:20px;z-index:99999;word-break:break-all;';
          var h3 = document.createElement('h3');
          h3.textContent = title;
          box.appendChild(h3);
          (lines || []).forEach(function (t) {
            var p = document.createElement('p');
            p.textContent = String(t);
            box.appendChild(p);
          });
          var btn = document.createElement('button');
          btn.textContent = 'Close';
          btn.onclick = function () { box.remove(); };
          box.appendChild(btn);
          document.body.appendChild(box);
        } catch (e) { /* 展示失败不影响主流程 */ }
      }
      window.onerror = function(msg, url, line, col, error) {
        // 良性警告过滤：ResizeObserver loop 是浏览器规范行为（容器尺寸单帧多次变化时
        // 由浏览器异步报告），Chrome 官方明确该错误无法通过代码消除、建议忽略，
        // 不影响任何功能——不显示红条以免误报。其余真实错误仍显示红条。
        if (msg && (msg.indexOf('ResizeObserver loop') === 0 || msg.indexOf('Script error.') === 0)) {
          return false;
        }
        showErrorBar('JS Error:', [msg, 'URL: ' + url, 'Line: ' + line], 'red');
        return false;
      };
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var text = reason && reason.message ? reason.message : reason;
        showErrorBar('Promise Error:', [text], 'orange');
      });
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
