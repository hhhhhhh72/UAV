<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚁</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>无人机产业综合服务平台</title>
    <meta name="description" content="重庆无人机产业协会 — 产业综合服务平台">
    <script>
      // Global Error Handler for White Screen Debugging
      window.onerror = function(msg, url, line, col, error) {
        // 良性警告过滤：ResizeObserver loop 是浏览器规范行为（容器尺寸单帧多次变化时
        // 由浏览器异步报告），Chrome 官方明确该错误无法通过代码消除、建议忽略，
        // 不影响任何功能——不显示红条以免误报。其余真实错误仍显示红条。
        if (msg && (msg.indexOf('ResizeObserver loop') === 0 || msg.indexOf('Script error.') === 0)) {
          return false;
        }
        var errorHtml = '<div style="position:fixed;top:0;left:0;right:0;background:red;color:white;padding:20px;z-index:99999;word-break:break-all;">' +
          '<h3>JS Error:</h3>' +
          '<p>' + msg + '</p>' +
          '<p>URL: ' + url + '</p>' +
          '<p>Line: ' + line + '</p>' +
          '<button onclick="this.parentNode.remove()">Close</button>' +
          '</div>';
        document.body.insertAdjacentHTML('beforeend', errorHtml);
        return false;
      };
      window.addEventListener('unhandledrejection', function(event) {
        var errorHtml = '<div style="position:fixed;top:0;left:0;right:0;background:orange;color:white;padding:20px;z-index:99999;word-break:break-all;">' +
          '<h3>Promise Error:</h3>' +
          '<p>' + event.reason + '</p>' +
          '<button onclick="this.parentNode.remove()">Close</button>' +
          '</div>';
        document.body.insertAdjacentHTML('beforeend', errorHtml);
      });
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
